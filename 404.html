<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        // Single Page App redirect for static hosts (GitHub Pages, etc.)
        (function() {
            var path = window.location.pathname.replace(/^\//, '');
            if (path && path !== 'index.html') {
                window.location.replace('/#' + path + window.location.search);
            } else {
                window.location.replace('/');
            }
        })();
    </script>
</head>
<body>
    <p style="font-family: sans-serif; padding: 20px;">Redirecting to SNS Placement Dashboard...</p>
</body>
</html>
