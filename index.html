        // Fetch data via Google Sheets API v4
        const fetchSheetData = async (sheetName) => {
            const cacheKey = `sns_sheet_api_${sheetName}`;
            try {
                const cached = localStorage.getItem(cacheKey);
                if (cached) {
                    const { data, timestamp } = JSON.parse(cached);
                    if (Date.now() - timestamp < SHEET_CONFIG.cacheTime) return { data, fromCache: true };
                }
            } catch (e) { }

            const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_CONFIG.spreadsheetId}/values/${encodeURIComponent(sheetName)}?key=${SHEET_CONFIG.apiKey}`;

            const res = await fetch(url);
            if (!res.ok) throw new Error(`Google API Error: ${res.status}`);

            const json = await res.json();
            const rows = json.values;

            if (!rows || rows.length < 2) return { data: [], fromCache: false };

            // Convert rows -> objects using header row
            const headers = rows[0];
            const data = rows.slice(1).map(row => {
                const obj = {};
                headers.forEach((h, i) => { obj[h] = row[i] !== undefined ? row[i] : ''; });
                return obj;
            });

            try { localStorage.setItem(cacheKey, JSON.stringify({ data, timestamp: Date.now() })); } catch (e) { }
            return { data, fromCache: false };
        };

        // Helper: derive academic year (Jun-May) from a date string
        const getAcademicYear = (dateStr) => {
            if (!dateStr) return null;
            const s = dateStr.trim();
            // Direct academic year format like "2024-25"
            if (/^\d{4}-\d{2}$/.test(s)) return s;
            // Parse "16 Apr 2025", "Apr 2025", "01 Mar 2025", etc.
            const monthMap = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
            const m = s.match(/(\d{1,2})?\s*([A-Za-z]+)\s*(\d{4})/);
            if (m) {
                const mon = monthMap[m[2].toLowerCase().slice(0, 3)];
                const year = parseInt(m[3]);
                if (mon !== undefined && year) {
                    // Jun(5)–Dec = start of academic year; Jan–May = end of previous academic year
                    if (mon >= 5) return `${year}-${(year + 1).toString().slice(-2)}`;
                    else return `${year - 1}-${year.toString().slice(-2)}`;
                }
            }
            return null;

                            {pg === "training" && (<div><h2 style={{ fontSize: 22, fontWeight: 800, marginBottom: 24 }}>Training Programs</h2><div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(300px, 1fr))", gap: 14, marginBottom: 28 }}>{Object.values(trainingData).map((t, i) => (<div key={i} className="card" style={{ padding: 24 }}><h3 style={{ fontSize: 15, fontWeight: 700, color: R, marginBottom: 4 }}>{t.t}</h3><div style={{ fontSize: 11, color: "#999", fontWeight: 600, marginBottom: 8 }}>Partner: {t.p}</div><p style={{ fontSize: 12, color: "#666", lineHeight: 1.6, marginBottom: 12 }}>{t.d}</p><div style={{ display: "flex", flexDirection: "column", gap: 5 }}>{t.m.map((m, j) => <div key={j} style={{ display: "flex", alignItems: "center", gap: 8 }}><div style={{ width: 4, height: 4, borderRadius: "50%", background: R, flexShrink: 0 }} /><span style={{ fontSize: 12, color: "#555" }}>{m}</span></div>)}</div></div>))}</div><h3 style={{ fontSize: 16, fontWeight: 700, marginBottom: 12 }}>Training Platforms</h3><div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(180px, 1fr))", gap: 10, marginBottom: 28 }}>{platformData.map((p, i) => <div key={i} className="card" style={{ padding: 14 }}><div style={{ fontSize: 13, fontWeight: 700 }}>{p.n}</div><div style={{ fontSize: 11, color: "#888" }}>{p.u}</div></div>)}</div><h3 style={{ fontSize: 16, fontWeight: 700, marginBottom: 12 }}>Global Certifications — {[...certData.it, ...certData.core].reduce((s, c) => s + c.c, 0).toLocaleString()}+</h3><div style={{ display: "flex", gap: 16, flexWrap: "wrap" }}><div className="card" style={{ padding: 20, flex: "1 1 340px" }}><h4 style={{ fontSize: 13, fontWeight: 700, marginBottom: 12 }}>IT Certifications</h4>{certData.it.map((c, i) => <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "5px 0", borderBottom: "1px solid #f5f5f5" }}><span style={{ fontSize: 12 }}>{c.n}</span><span style={{ fontSize: 13, fontWeight: 800, color: c.cl, fontFamily: "'Space Mono',monospace" }}>{c.c.toLocaleString()}</span></div>)}</div><div className="card" style={{ padding: 20, flex: "1 1 240px" }}><h4 style={{ fontSize: 13, fontWeight: 700, marginBottom: 12 }}>Core Certifications</h4>{certData.core.map((c, i) => <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "5px 0", borderBottom: "1px solid #f5f5f5" }}><span style={{ fontSize: 12 }}>{c.n}</span><span style={{ fontSize: 13, fontWeight: 800, color: c.cl, fontFamily: "'Space Mono',monospace" }}>{c.c}</span></div>)}</div></div></div>)}

                            {pg === "upcoming" && (<div><h2 style={{ fontSize: 22, fontWeight: 800, marginBottom: 8 }}>Upcoming Drives & Certifications</h2><p style={{ fontSize: 13, color: "#999", marginBottom: 24 }}>Track drives and certification availability for YOP 2026.</p><h3 style={{ fontSize: 16, fontWeight: 700, marginBottom: 12 }}>📅 Upcoming Drives</h3><div className="card" style={{ overflow: "auto", marginBottom: 28 }}><table className="tbl"><thead><tr><th>Company</th><th>Date</th><th>Package</th><th>Roles</th><th>Eligibility</th><th>College</th></tr></thead><tbody>{upcoming.filter(d => col === "all" || d.cl === col).map((d, i) => (<tr key={i}><td style={{ fontWeight: 700 }}>{d.co}</td><td><Badge bg="#FFF3E0" fg="#E65100">{d.dt}</Badge></td><td style={{ fontWeight: 600, color: R, fontFamily: "'Space Mono',monospace", fontSize: 12 }}>{d.pk}</td><td style={{ fontSize: 12, color: "#666" }}>{d.ro}</td><td style={{ fontSize: 11, color: "#888" }}>{d.el}</td><td style={{ fontSize: 12 }}>{d.cl.toUpperCase()}</td></tr>))}</tbody></table></div><h3 style={{ fontSize: 16, fontWeight: 700, marginBottom: 12 }}>🏅 Certified Talent Pool for Recruiters</h3><div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(200px, 1fr))", gap: 10 }}>{(() => { const deptMap = { "Microsoft": "CSE, IT", "Databricks": "AI&DS, CSE", "AWS": "CSE, IT, ECE", "Snowflake": "CSE, IT", "Salesforce": "CSE, MBA", "NVIDIA": "AI&ML", "Oracle": "CSE, IT", "Google": "All Depts", "ServiceNow": "CSE, IT", "CATIA": "Mech, Aero", "FOSTAC": "Food Tech", "HACCP": "Food Tech", "BIM": "Civil", "CAD Design": "Mech, Civil" }; return [...certData.it, ...certData.core].map((c, i) => (<div key={i} className="card" style={{ padding: 14 }}><div style={{ fontSize: 12, fontWeight: 700, marginBottom: 2 }}>{c.n}</div><div style={{ fontSize: 20, fontWeight: 800, color: c.cl || R, fontFamily: "'Space Mono',monospace" }}>{c.c.toLocaleString()}</div><div style={{ fontSize: 10, color: "#999" }}>Depts: {deptMap[c.n] || "All Depts"}</div><Badge bg="#E8F5E9" fg="#2E7D32">Available</Badge></div>)); })()}</div></div>)}

                            {pg === "facilities" && (<div><h2 style={{ fontSize: 22, fontWeight: 800, marginBottom: 24 }}>Campus Placement Facilities</h2><div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(240px, 1fr))", gap: 12 }}>{facilityData.map((f, i) => <div key={i} className="card" style={{ padding: 18, display: "flex", gap: 12, alignItems: "flex-start" }}><div style={{ fontSize: 26, flexShrink: 0 }}>{f.i}</div><div><div style={{ fontSize: 14, fontWeight: 700, marginBottom: 2 }}>{f.t}</div><div style={{ fontSize: 12, color: "#888" }}>{f.d}</div></div></div>)}</div><div className="card" style={{ padding: 24, marginTop: 20, borderLeft: `4px solid ${R}` }}><h3 style={{ fontSize: 15, fontWeight: 700, marginBottom: 8 }}>IIPC Mission</h3><p style={{ fontSize: 13, color: "#666", lineHeight: 1.7 }}>The Industry Institute Partnership Cell synergizes academic activities with industry needs through strategic planning. SNSCT IIPC functions with excellent rapport with industries in and around Coimbatore — offering technical consultancy, latest engineering courses, sponsored R&D, seminars, workshops, and industrial training programmes.</p></div></div>)}

                        </main>
                    </div>)}
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
